<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball MVP Certificate Generator</title>
  <meta name="description" content="Generate and download customized high-resolution Certificates of Recognition for Basketball MVP awards.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&family=Oswald:wght@700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- html2canvas fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="badge">BORCELLE ACADEMY</div>
      <h1>Certificate Generator</h1>
      <p>Enter recipient name to generate a customized high-resolution certificate.</p>
    </header>

    <main class="main-content">
      <!-- Control Panel -->
      <section class="control-panel">
        <div class="form-group">
          <label for="recipientInput">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Recipient Name
          </label>
          <div class="input-wrapper">
            <input type="text" id="recipientInput" placeholder="Enter name..." value="Jatin Verma" maxlength="40" autocomplete="off">
            <button type="button" class="btn-clear" id="btnClear" title="Clear input">&times;</button>
          </div>
        </div>

        <!-- Font & Style Controls -->
        <div class="style-controls">
          <div class="control-subgroup">
            <label for="fontSelect">Font Style:</label>
            <select id="fontSelect">
              <option value="'Shrikhand', cursive, serif" selected>Shrikhand (Retro Groovy)</option>
              <option value="'Cinzel', serif">Cinzel (Classic/Golden)</option>
              <option value="'Montserrat', sans-serif">Montserrat (Modern Bold)</option>
              <option value="'Playfair Display', serif">Playfair Display (Elegant)</option>
              <option value="'Oswald', sans-serif">Oswald (Bold Condensed)</option>
            </select>
          </div>

          <div class="control-subgroup">
            <label for="colorPicker">Name Color:</label>
            <div class="color-picker-wrapper">
              <input type="color" id="colorPicker" value="#fb4d3d">
              <span id="colorHex">#fb4d3d</span>
            </div>
          </div>
        </div>

        <!-- Download Action -->
        <div class="action-row">
          <button id="btnDownload" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download Certificate
          </button>
        </div>
      </section>

      <!-- Certificate Preview Container -->
      <section class="preview-section">
        <div class="preview-header">
          <span class="preview-title">Live Certificate Preview</span>
          <span class="preview-hint">High Resolution 2048 × 1446 px</span>
        </div>

        <div class="certificate-wrapper" id="certificateWrapper">
          <!-- Base Certificate Image Template -->
          <img id="certificateBg" alt="Certificate Template" class="certificate-bg">
          
          <!-- Dynamic Recipient Name Overlay -->
          <div class="overlay-name-container" id="nameContainer">
            <h2 id="displayRecipientName" class="display-name">Jatin Verma</h2>
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026 Borcelle Academy | Certificate Generator</p>
    </footer>
  </div>

  <!-- Off-screen Canvas for High-Res PNG Exporting -->
  <canvas id="exportCanvas" width="2048" height="1446" style="display:none;"></canvas>

  <!-- Main Script -->
  <script type="module" src="/src/controllers/script.js"></script>
</body>
</html>
