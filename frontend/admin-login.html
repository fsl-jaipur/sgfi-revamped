<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - SGFI</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#123524" />

  <link rel="icon" href="https://studentgames.ind.in/assets/images/main.logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body class="admin-shell">
  <main class="admin-login-page" id="main-content">
    <section class="admin-login-panel" aria-labelledby="admin-login-title">
      <div class="admin-login-brand">
        <img src="https://studentgames.ind.in/assets/images/main.logo.png" alt="SGFI logo" class="admin-login-logo" />
        <div>
          <p class="admin-kicker">Secure Admin</p>
          <h1 id="admin-login-title" class="admin-login-title">SGFI Records</h1>
        </div>
      </div>

      <form id="admin-login-form" class="admin-form-stack" autocomplete="off" novalidate>
        <div>
          <label class="field-label" for="admin-username">Username</label>
          <input class="field-input" type="text" id="admin-username" name="username" autocomplete="username" required />
        </div>

        <div>
          <label class="field-label" for="admin-password">Password</label>
          <div class="password-input-wrapper">
            <input class="field-input" type="password" id="admin-password" name="password" autocomplete="current-password" required />
            <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Show password" title="Toggle password visibility">
              <svg class="eye-icon-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
              <svg class="eye-icon-open hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p id="admin-login-error" class="admin-alert admin-alert-error hidden" role="alert"></p>

        <button id="admin-login-submit" type="submit" class="btn btn-primary admin-full-button">
          Login
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="/src/controllers/adminController.js"></script>
</body>
</html>
